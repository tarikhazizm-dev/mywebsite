<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Event Planner</title>
        <style>
            body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; }
            label { display:block; margin:.5rem 0 .25rem; }
            input, textarea { width:100%; padding:.5rem; }
            button { margin-top: 1rem; padding:.6rem 1rem; cursor:pointer; }
            .summary { margin-top: 1.5rem; white-space: pre-wrap; border:1px solid #ddd; padding:1rem; border-radius:.5rem; }
        </style>
    </head>
    <body>
        <h1>Event Planner</h1>

        <label>Name</label>
        <input id="name" type="text" />

        <label>Type of event</label>
        <input id="type" type="text" placeholder="birthday party, wedding, …" />

        <label>Location</label>
        <input id="location" type="text" />

        <label>Main theme / color</label>
        <input id="theme" type="text" />

        <label>Key guest / speaker</label>
        <input id="speaker" type="text" />

        <label>Guests expected</label>
        <input id="guests" type="number" min="0" />

        <button id="build">Build Summary</button>

        <div id="out" class="summary"></div>

        <script>
            document.getElementById('build').addEventListener('click', () => {
                const name = document.getElementById('name').value.trim();
                const type = document.getElementById('type').value.trim();
                const loc = document.getElementById('location').value.trim();
                const theme = document.getElementById('theme').value.trim();
                const spk = document.getElementById('speaker').value.trim();
                const guests = document.getElementById('guests').value.trim();

                const text =
`Hello ${name}!
Your ${type} is all set to happen at ${loc}.
You can expect around ${guests} guests to join the celebration.
The event will be adorned with a ${theme} theme, making it a memorable day.
Special guest ${spk} will be the highlight of the event.
We are looking forward to helping you make your event successful!`;

                document.getElementById('out').textContent = text;
            });
        </script>
    </body>
</html>
